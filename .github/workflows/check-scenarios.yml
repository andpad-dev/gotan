name: check-scenarios

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  # 問題ディレクトリを置くルート. 構成を変える場合はここだけ変更する.
  # 1 階層であることを difficulty-label の cut が前提にしている.
  WORKSHOP_DIR: workshop

jobs:
  # 問題ディレクトリの構成 (<カテゴリ>/<難易度>/<問題名>/README.md) を検証する.
  structure:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Check question directory structure
        run: |
          set -euo pipefail
          bad=0
          # 難易度ディレクトリ名の検証.
          for d in "${WORKSHOP_DIR}"/[0-9][0-9]-*/*/; do
            [ -d "${d}" ] || continue
            level=$(basename "${d}")
            case "${level}" in
              01-beginner|02-intermediate|03-advanced) ;;
              *)
                echo "::error::${d} は難易度ディレクトリ (01-beginner / 02-intermediate / 03-advanced) ではありません"
                bad=1
                ;;
            esac
          done
          # 問題ディレクトリ直下に README.md があるか検証.
          found=0
          for d in "${WORKSHOP_DIR}"/[0-9][0-9]-*/[0-9][0-9]-*/*/; do
            [ -d "${d}" ] || continue
            found=$((found + 1))
            if [ ! -f "${d}README.md" ]; then
              echo "::error::${d} に README.md がありません"
              bad=1
            fi
          done
          # 問題が 1 つも見つからないなら、検査そのものが空振りしている.
          # ディレクトリ構成を変えたときに、検査が黙って素通りするのを防ぐ.
          if [ "${found}" -eq 0 ]; then
            echo "::error::${WORKSHOP_DIR} 配下に問題ディレクトリが見つかりません. WORKSHOP_DIR の設定を確認してください"
            bad=1
          fi
          echo "問題ディレクトリを ${found} 件検査しました"
          exit "${bad}"

  # Markdown 内のリンク切れを検証する.
  links:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        env:
          # プライベートリポジトリ (このリポジトリの PR 等) へのリンク検証に必要.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-progress --accept '200..=299,403,429' --exclude 'img\.shields\.io' './**/*.md'
          fail: true

  # 問題を変更する PR に、難易度ディレクトリと一致するラベルを必須にする.
  difficulty-label:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require difficulty label matching level directory
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # 問題ディレクトリ (<カテゴリ>/<難易度>/<問題名>/) 配下の変更のみ対象.
          # 難易度ディレクトリ直下の .gitkeep 等は含めない.
          # HEAD ではなく PR ブランチ先端 (HEAD_SHA) を使うことで、
          # main に新しいコミットがマージされた後でも正確に PR の差分だけを比較する.
          # cut の -f3 は WORKSHOP_DIR が 1 階層であることを前提にしている.
          levels=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
            | { grep -E "^${WORKSHOP_DIR}/[0-9]{2}-[a-z-]+/(01-beginner|02-intermediate|03-advanced)/[^/]+/" || true; } \
            | cut -d/ -f3 | sort -u)
          if [ -z "${levels}" ]; then
            echo "問題ディレクトリの変更がないためスキップします"
            exit 0
          fi
          bad=0
          for level in ${levels}; do
            case "${level}" in
              01-beginner) want="初級" ;;
              02-intermediate) want="中級" ;;
              03-advanced) want="上級" ;;
            esac
            case ",${LABELS}," in
              *",${want},"*)
                echo "${level} に対応するラベル「${want}」が付いています"
                ;;
              *)
                echo "::error::${level} の問題を変更しています。ラベル「${want}」を付けてください"
                bad=1
                ;;
            esac
          done
          exit "${bad}"
